name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # 使用的 Zig 版本。如果 ziglang/setup-zig 找不到这个 exact build，
  # 可以改成 0.17.0-dev（最新 0.17 开发版）或 master（最新主线）。
  ZIG_VERSION: 0.17.0-dev.1509+bb296ab9b

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ziglang/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ziglang/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - run: zig build test

  integ:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: ziglang/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build
      - name: Run integration test
        run: |
          zig-out/bin/zig_forward &
          PID=$!
          sleep 2
          zig build integ
          EXIT=$?
          kill $PID 2>/dev/null || true
          exit $EXIT

  bench:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: ziglang/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Doptimize=ReleaseFast
      - name: Run benchmark
        run: |
          zig-out/bin/zig_forward &
          PID=$!
          sleep 2
          zig build bench
          EXIT=$?
          kill $PID 2>/dev/null || true
          exit $EXIT