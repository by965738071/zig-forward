name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build
      - run: zig build test

  integ:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build
      - name: Run integration test
        run: |
          zig-out/bin/zig_forward &
          PID=$!
          sleep 2
          zig build integ
          EXIT=$?
          kill $PID 2>/dev/null || true
          exit $EXIT

  bench:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
      - run: zig build -Doptimize=ReleaseFast
      - name: Run benchmark
        run: |
          zig-out/bin/zig_forward &
          PID=$!
          sleep 2
          zig build bench
          EXIT=$?
          kill $PID 2>/dev/null || true
          exit $EXIT